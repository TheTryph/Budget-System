<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget System</title>
    <link rel = "stylesheet" href = "general.css">
  </head>
  <body>
    
          
    <div class="container">
      <div class="card">
        <h1>Account Creation</h1>

        <form>
          <div class="row">
            <div class="field">
              <label>Account Name</label>
              <input id="account-name" type="string" min="0" placeholder="0" />
            </div>
            <div class="field">
              <label>Starting Balance</label>
              <input id="account-amount" type="number" min="0" placeholder="0" />
            </div>
            <div class = "field" >
              <label>&nbsp;</label>
              <button type="button" id="confirm">Create Account</button>
            </div>
          </div>
        </form>

        <div class="summary" id="accounts">
            <div class="summary-item"><div class="summary-label">${element.Name}</div><div class="summary-value">${element.Amount}MAD</div></div>
        </div>
      </div>
    </div>
    <script src="createAccount.js">
    </script>
  </body>
</html>
